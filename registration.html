<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .container{
            width: 100%;
        height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            gap: 24px;
        }
        input{
            padding: 8px 16px;
            outline: none;
            border: none;
            border: 1px solid green;
        }
        button{
            font-size: 14px;
            font-weight: 400;
            padding: 8px 18px;
            border-radius: 8% ;
            border: none;
            
         
        }
        button:hover{
           background-color: chartreuse;
           border: 1px solid black;
        }
        #res:hover{
             background-color: rgb(236, 50, 50);
           border: 1px solid black;
        }
       
        .but{
            margin-left: 18px;
            row-gap: 4px;
        }
        h1{
            margin-bottom: 42px;
        }
        
            form div{
               margin: 16px 0;
}
        
    </style>
</head>
<body>
    <div class=" container">
           <form action="index.html">
              <h1 >Registration User</h1>
             <div>Name   :   <input type="text" placeholder="Name"></div>
             <div>Email : <input type="email" placeholder="email"></div>
             <div>Phone : <input type="tel" placeholder="phone"></div>
             <div>Address : <input type="text" placeholder="Address"></div>
             <div>Username : <input type="text" placeholder="Username"></div>
             <div>password : <input type="password" placeholder="password"></div>
             <div class="but"> 
                <button type="submit">Register</button>
                <button type="reset" id="res">reset</button>
            </div>
           </form>
            
             
    </div>
    
</body>
</html>
